name: Auto Multi-Channel Quiz

on:
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Channel ID to trigger'
        required: false
        default: ''
      target_quiz_id:
        description: 'Specific Quiz ID to trigger'
        required: false
        default: ''

jobs:
  run-quiz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Quiz Broadcast
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHANNEL: ${{ github.event.inputs.target_channel }}
          TARGET_QUIZ_ID: ${{ github.event.inputs.target_quiz_id }}
        run: python send_quiz.py
