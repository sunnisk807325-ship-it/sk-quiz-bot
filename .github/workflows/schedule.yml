name: Auto Multi-Channel Quiz

on:
  push:
    paths:
      - 'quiz.json'
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Channel ID to trigger'
        required: false
        default: ''
      target_quiz_id:
        description: 'Specific Quiz ID to trigger'
        required: false
        default: ''
      run_mode:
        description: 'original or scheduled'
        required: false
        default: 'scheduled'

permissions:
  contents: write

jobs:
  sync-alarms:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Sync Cron-Job.org Alarms
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          CRON_API_KEY: ${{ secrets.CRON_API_KEY }}
          REPO_NAME: ${{ github.repository }}
        run: python sync_cron.py

      - name: Save Cron Job IDs back to quiz.json
        run: |
          git config user.name "Quiz Bot Sync"
          git config user.email "bot@users.noreply.github.com"
          git add quiz.json
          git commit -m "chore: update cron_job_ids [skip ci]" || exit 0
          git push

  run-quiz:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Quiz Broadcast & Leaderboard
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CRON_API_KEY: ${{ secrets.CRON_API_KEY }}
          TARGET_CHANNEL: ${{ github.event.inputs.target_channel }}
          TARGET_QUIZ_ID: ${{ github.event.inputs.target_quiz_id }}
          RUN_MODE: ${{ github.event.inputs.run_mode }}
        run: python send_quiz.py

      - name: Update History After Run
        run: |
          git config user.name "Quiz Bot Cleanup"
          git config user.email "bot@users.noreply.github.com"
          git add quiz.json
          git commit -m "chore: clean completed scheduled quiz [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
