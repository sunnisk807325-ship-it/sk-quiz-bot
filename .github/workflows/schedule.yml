name: Auto Quiz Broadcast

on:
  schedule:
    - cron: '2 15 10 11 *'
  workflow_dispatch:

jobs:
  run-quiz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Quiz Broadcast
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python send_quiz.py
